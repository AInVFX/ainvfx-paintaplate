[project]
name = "ainvfx-paintaplate"
version = "1.0.4"
description = "Paint on the first frame of a plate to erase, add or relight, watch the edit carry through the shot, and export it in the plate's own format, layers and untouched pixels."
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The Registry reads only this static list; ComfyUI Manager and the Registry's node scan install requirements.txt.
# tests/test_registry.py keeps the two equal.
dependencies = ["OpenEXR>=3.3", "opencolorio>=2.4"]
# No accelerator: the nodes run on a CPU (the CI runs them there). The models' GPU needs are in the README.
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AInVFX/ainvfx-paintaplate"
Documentation = "https://github.com/AInVFX/ainvfx-paintaplate#readme"
"Bug Tracker" = "https://github.com/AInVFX/ainvfx-paintaplate/issues"

[tool.comfy]
PublisherId = "ainvfx"
DisplayName = "AInVFX Paint a plate"
Icon = "https://raw.githubusercontent.com/AInVFX/ainvfx-paintaplate/main/web/brand/registry-icon.png"
Banner = "https://raw.githubusercontent.com/AInVFX/ainvfx-paintaplate/main/web/brand/banner.png"
requires-comfyui = ">=0.43.0"
