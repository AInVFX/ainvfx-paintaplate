name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (no ComfyUI, no models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v

  comfyui:
    name: Live tests (ComfyUI on CPU, placeholder models, headless browser)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: bash tools/ci_comfyui.sh "$RUNNER_TEMP/ci" | tail -n 1 >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
