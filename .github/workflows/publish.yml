name: Publish to Comfy Registry
# Manual until the contest submission (AInVFX, 27 Oct 2026): Actions > Publish to Comfy Registry > Run workflow.
on:
  workflow_dispatch:

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'AInVFX' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9  # main on 28 Oct 2026, pinned: it receives the Registry token
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
